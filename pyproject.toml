[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.8",
    "django-environ>=0.12.0",
    "psycopg2-binary>=2.9.11",
    "pytest>=8.3.4",
    "pytest-django>=4.9.0",
    "pytest-playwright>=0.6.2",
    "pytest-xdist>=3.6.1",
    "playwright>=1.49.1",
    "faker>=40.36.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["app/tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--reuse-db",
]

[tool.coverage.run]
source = ["app", "config", "common"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "mypy>=2.3.1",
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
# 段階的に導入するため、まずは「型注釈が書かれている箇所」だけを検査する。
# 注釈の無い関数は対象外とし、Protocolによる依存宣言(Inheritance Rules参照)が
# 実際に検査されることを最優先の目的とする。
check_untyped_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["^app/migrations/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["app.tests.*", "app.seeds.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
