<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク一覧</title>
    <link rel="stylesheet" href="../../app/static/app/common.css">
</head>
<!-- 一覧画面の見本。app/templates/app/<model>/index.html に相当する。 app/static/app/common.css の ds- クラスだけで構成する -->
<body class="ds-page">
    <div class="ds-app">
        <aside class="ds-sidebar">
            <a class="ds-brand" href="index.html"><span class="ds-brand-mark"><span class="ds-icon ds-icon--check"></span></span>Task Manager</a>
            <div class="ds-nav-label">メニュー</div>
            <nav class="ds-nav">
                <a class="ds-nav-item" href="index.html"><span class="ds-icon ds-icon--home"></span>ホーム</a>
                <a class="ds-nav-item" href="list.html" aria-current="page"><span class="ds-icon ds-icon--tasks"></span>タスク一覧</a>
                <a class="ds-nav-item" href="#"><span class="ds-icon ds-icon--users"></span>社員一覧</a>
                <a class="ds-nav-item" href="#"><span class="ds-icon ds-icon--building"></span>会社一覧</a>
                <a class="ds-nav-item" href="#"><span class="ds-icon ds-icon--sitemap"></span>部門一覧</a>
                <a class="ds-nav-item" href="#"><span class="ds-icon ds-icon--shield"></span>管理グループ一覧</a>
            </nav>
            <!-- ログアウトは POST フォームの button。見た目は ds-nav-item を button に適用する -->
            <form class="ds-sidebar-footer" method="post" action="#">
                <button type="submit" class="ds-nav-item"><span class="ds-icon ds-icon--logout"></span>ログアウト</button>
            </form>
        </aside>

        <div class="ds-main">
            <header class="ds-topbar">
                <div class="ds-user"><span class="ds-avatar">Y</span>yamada(管理者)</div>
            </header>

            <main class="ds-content">
                <!-- フラッシュメッセージ(messages.success)。閉じるボタン付き -->
                <div class="ds-messages">
                    <div class="ds-alert ds-alert--success" role="alert">
                        <span class="ds-alert-message">タスクを作成しました。</span>
                        <button type="button" class="ds-alert-close" aria-label="閉じる" onclick="this.closest('.ds-alert').remove()"></button>
                    </div>
                </div>

                <!-- ページヘッダー: 左にh1、右にアクション。一覧の主アクションは primary の「新規作成」 -->
                <div class="ds-page-header">
                    <h1 class="ds-h1">タスク一覧</h1>
                    <div class="ds-actions">
                        <a href="form.html" class="ds-btn ds-btn-primary">新規作成</a>
                    </div>
                </div>

                <!-- 0件のとき: <div class="ds-empty">タスクがありません。</div> -->
                <div class="ds-card ds-card--flush">
                    <table class="ds-table">
                        <thead>
                            <tr><th>タイトル</th><th>ステータス</th><th>優先度</th><th>作成日時</th></tr>
                        </thead>
                        <tbody>
                                <tr data-href="detail.html">
                                    <td>資料作成</td>
                                    <td><span class="ds-status">To Do</span></td>
                                    <td class="ds-muted">3</td>
                                    <td class="ds-muted">2026-09-01 10:00</td>
                                </tr>
                                <tr data-href="detail.html">
                                    <td>レビュー対応</td>
                                    <td><span class="ds-status ds-status--progress">In Progress</span></td>
                                    <td class="ds-muted">2</td>
                                    <td class="ds-muted">2026-09-03 14:30</td>
                                </tr>
                                <tr data-href="detail.html">
                                    <td>リリース準備</td>
                                    <td><span class="ds-status ds-status--done">Done</span></td>
                                    <td class="ds-muted">1</td>
                                    <td class="ds-muted">2026-09-05 09:15</td>
                                </tr>
                                <tr data-href="detail.html">
                                    <td>#123 対応</td>
                                    <td><span class="ds-status">To Do</span></td>
                                    <td class="ds-muted">4</td>
                                    <td class="ds-muted">2026-09-08 11:20</td>
                                </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.querySelectorAll('tr[data-href]').forEach(function (row) {
            row.addEventListener('click', function () { window.location.href = row.dataset.href; });
        });
    </script>
</body>
</html>
