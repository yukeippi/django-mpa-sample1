{% extends 'layouts/default.html' %}

{% block title %}権限がありません{% endblock %}

{% block content %}
<div class="ds-stack">
    <div class="ds-alert ds-alert--error" id="permission-denied-message">
        <span class="ds-alert-message">このタスクを操作する権限がありません。</span>
    </div>
    <div class="ds-actions">
        <a href="{% url 'app:task_index' %}" class="ds-btn">タスク一覧に戻る</a>
    </div>
</div>
{% endblock %}
