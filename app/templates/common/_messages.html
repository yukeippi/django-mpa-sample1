{% if messages %}
<div class="ds-messages messages">
    {% for message in messages %}
    <div class="ds-alert ds-alert--{{ message.tags }}" role="alert">
        <span class="ds-alert-message">{{ message.message }}</span>
        <button type="button" class="ds-alert-close" aria-label="閉じる" onclick="this.closest('.ds-alert').remove()"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
