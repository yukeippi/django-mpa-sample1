{% extends 'app/employee/base.html' %}

{% block title %}社員削除確認{% endblock %}

{% block content %}
<div class="ds-page-header">
    <h1 class="ds-h1">社員情報を削除しますか?</h1>
</div>

<div class="ds-card ds-card--narrow">
    <div class="ds-stack">
        <p id="delete-employee-name" class="ds-card-title">{{ employee }}</p>
        <div class="ds-actions">
            <form method="post" id="employee-delete-form">
                {% csrf_token %}
                <button type="submit" id="employee-delete-confirm" class="ds-btn ds-btn-danger">削除する</button>
            </form>
            <a href="{% url 'app:employee_show' employee.pk %}" class="ds-btn">キャンセル</a>
        </div>
    </div>
</div>
{% endblock %}
