{% extends 'app/employee/base.html' %}

{% block title %}{{ employee }}{% endblock %}

{% block content %}
<div class="ds-page-header">
    <h1 id="employee-name" class="ds-h1">{{ employee }}</h1>
    <div class="ds-actions">
        <a href="{% url 'app:employee_index' %}" class="ds-btn">一覧に戻る</a>
        <a href="{% url 'app:employee_edit' employee.pk %}" id="edit-employee-link" class="ds-btn ds-btn-primary">編集</a>
        <a href="{% url 'app:employee_delete' employee.pk %}" id="delete-employee-link" class="ds-btn ds-btn-danger">削除</a>
    </div>
</div>

<div class="ds-card ds-card--flush ds-card--narrow">
    <dl class="ds-detail">
        <div class="ds-detail-item">
            <dt class="ds-detail-label">社員番号</dt>
            <dd class="ds-detail-value" id="employee-number">{{ employee.employee_number }}</dd>
        </div>
        <div class="ds-detail-item">
            <dt class="ds-detail-label">氏名</dt>
            <dd class="ds-detail-value" id="employee-full-name">{{ employee }}</dd>
        </div>
    </dl>
</div>
{% endblock %}
