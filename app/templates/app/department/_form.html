<form method="post" id="department-form" class="ds-form">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="ds-alert ds-alert--error"><span class="ds-alert-message">{{ form.non_field_errors }}</span></div>
    {% endif %}
    <div class="ds-field">
        <label for="{{ form.company.id_for_label }}" class="ds-label">会社</label>
        {{ form.company }}
        {% if form.company.errors %}
        <div class="ds-field-error">{{ form.company.errors }}</div>
        {% endif %}
    </div>
    <div class="ds-field">
        <label for="{{ form.name.id_for_label }}" class="ds-label">部門名</label>
        {{ form.name }}
        {% if form.name.errors %}
        <div class="ds-field-error">{{ form.name.errors }}</div>
        {% endif %}
    </div>
    <div class="ds-form-actions">
        <button type="submit" id="department-form-submit" class="ds-btn ds-btn-primary">保存</button>
    </div>
</form>
