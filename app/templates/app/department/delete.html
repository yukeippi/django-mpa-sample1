{% extends 'app/department/base.html' %}

{% block title %}部門削除確認{% endblock %}

{% block content %}
<div class="ds-page-header">
    <h1 class="ds-h1">部門を削除しますか?</h1>
</div>

<div class="ds-card ds-card--narrow">
    <div class="ds-stack">
        <p id="delete-department-name" class="ds-card-title">{{ department.name }}</p>
        <div class="ds-actions">
            <form method="post" id="department-delete-form">
                {% csrf_token %}
                <button type="submit" id="department-delete-confirm" class="ds-btn ds-btn-danger">削除する</button>
            </form>
            <a href="{% url 'app:department_show' department.pk %}" class="ds-btn">キャンセル</a>
        </div>
    </div>
</div>
{% endblock %}
