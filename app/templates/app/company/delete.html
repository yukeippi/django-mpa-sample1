{% extends 'app/company/base.html' %}

{% block title %}会社削除確認{% endblock %}

{% block content %}
<div class="ds-page-header">
    <h1 class="ds-h1">会社を削除しますか?</h1>
</div>

<div class="ds-card ds-card--narrow">
    <div class="ds-stack">
        <p id="delete-company-name" class="ds-card-title">{{ company.name }}</p>
        <div class="ds-actions">
            <form method="post" id="company-delete-form">
                {% csrf_token %}
                <button type="submit" id="company-delete-confirm" class="ds-btn ds-btn-danger">削除する</button>
            </form>
            <a href="{% url 'app:company_show' company.pk %}" class="ds-btn">キャンセル</a>
        </div>
    </div>
</div>
{% endblock %}
