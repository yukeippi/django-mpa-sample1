{% extends 'app/company/base.html' %}

{% block title %}会社一覧{% endblock %}

{% block content %}
<div class="ds-page-header">
    <h1 class="ds-h1">会社一覧</h1>
    <div class="ds-actions">
        <a href="{% url 'app:company_new' %}" id="new-company-link" class="ds-btn ds-btn-primary">新規作成</a>
    </div>
</div>

{% if companies %}
    <div class="ds-card ds-card--flush">
        <table id="company-table" class="ds-table">
            <thead>
                <tr>
                    <th>会社名</th>
                </tr>
            </thead>
            <tbody>
                {% for company in companies %}
                <tr class="company-row" data-href="{% url 'app:company_show' company.pk %}">
                    <td>{{ company.name }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% else %}
    <p id="no-companies" class="ds-empty">会社が登録されていません。</p>
{% endif %}
{% endblock %}

{% block extra_js %}
<script>
document.querySelectorAll('.company-row').forEach(function (row) {
    row.addEventListener('click', function () {
        window.location.href = row.dataset.href;
    });
});
</script>
{% endblock %}
