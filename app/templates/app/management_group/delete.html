{% extends 'app/management_group/base.html' %}

{% block title %}管理グループ削除確認{% endblock %}

{% block content %}
<div class="ds-page-header">
    <h1 class="ds-h1">管理グループを削除しますか?</h1>
</div>

<div class="ds-card ds-card--narrow">
    <div class="ds-stack">
        <p id="delete-management-group-name" class="ds-card-title">{{ management_group.name }}</p>
        <div class="ds-actions">
            <form method="post" id="management-group-delete-form">
                {% csrf_token %}
                <button type="submit" id="management-group-delete-confirm" class="ds-btn ds-btn-danger">削除する</button>
            </form>
            <a href="{% url 'app:management_group_show' management_group.pk %}" class="ds-btn">キャンセル</a>
        </div>
    </div>
</div>
{% endblock %}
