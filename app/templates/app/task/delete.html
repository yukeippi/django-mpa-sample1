{% extends 'app/task/base.html' %}

{% block title %}タスク削除確認{% endblock %}

{% block content %}
<div class="ds-page-header">
    <h1 class="ds-h1">タスクを削除しますか?</h1>
</div>

<div class="ds-card ds-card--narrow">
    <div class="ds-stack">
        <p id="delete-task-title" class="ds-card-title">{{ task.title }}</p>
        <div class="ds-actions">
            <form method="post" id="task-delete-form">
                {% csrf_token %}
                <button type="submit" id="task-delete-confirm" class="ds-btn ds-btn-danger">削除する</button>
            </form>
            <a href="{% url 'app:task_show' task.pk %}" class="ds-btn">キャンセル</a>
        </div>
    </div>
</div>
{% endblock %}
